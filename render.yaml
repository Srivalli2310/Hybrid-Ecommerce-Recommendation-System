services:
  - type: web
    name: hybrid-ecommerce-recommender
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=2 --threads=4 --timeout=120 app:app
    plan: free
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: hybrid_ecommerce
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.12
